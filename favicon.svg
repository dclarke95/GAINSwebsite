<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dumbbell/Weights Icon -->
  <!-- Left weight -->
  <rect x="5" y="35" width="20" height="30" rx="3" fill="url(#blueGradient)"/>
  <!-- Right weight -->
  <rect x="75" y="35" width="20" height="30" rx="3" fill="url(#blueGradient)"/>
  <!-- Center bar -->
  <rect x="25" y="45" width="50" height="10" rx="5" fill="url(#blueGradient)"/>
  <!-- Highlight on left weight -->
  <rect x="8" y="38" width="8" height="8" rx="1" fill="#ffffff" opacity="0.3"/>
  <!-- Highlight on right weight -->
  <rect x="84" y="38" width="8" height="8" rx="1" fill="#ffffff" opacity="0.3"/>
</svg>
